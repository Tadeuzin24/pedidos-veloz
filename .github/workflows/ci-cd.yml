name: CI/CD - Pedidos Veloz

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - pedidos
          - pagamentos
          - estoque
          - gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Instalar dependências
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Executar testes
        working-directory: ${{ matrix.service }}
        run: npm test

  docker:
    name: Build e publicação das imagens
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push - Pedidos
        uses: docker/build-push-action@v6
        with:
          context: ./pedidos
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pedidos-veloz-pedidos:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/pedidos-veloz-pedidos:latest

      - name: Build e push - Pagamentos
        uses: docker/build-push-action@v6
        with:
          context: ./pagamentos
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pedidos-veloz-pagamentos:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/pedidos-veloz-pagamentos:latest

      - name: Build e push - Estoque
        uses: docker/build-push-action@v6
        with:
          context: ./estoque
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pedidos-veloz-estoque:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/pedidos-veloz-estoque:latest

      - name: Build e push - Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pedidos-veloz-gateway:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/pedidos-veloz-gateway:latest