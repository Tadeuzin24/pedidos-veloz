apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: jaeger

  template:
    metadata:
      labels:
        app: jaeger

    spec:
      containers:
        - name: jaeger
          image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: ui
              containerPort: 16686

            - name: otlp-grpc
              containerPort: 4317

            - name: otlp-http
              containerPort: 4318

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"